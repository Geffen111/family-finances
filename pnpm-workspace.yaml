# Approve esbuild's install script (it fetches the platform binary Vite needs).
# pnpm 11+ reads `allowBuilds`; this entry used to hold pnpm's own unfilled
# placeholder ("set this to true or false"), which counts as NOT approved -- so
# every install ended in ERR_PNPM_IGNORED_BUILDS. pnpm 11 let CI paper over it
# with `pnpm rebuild esbuild`; pnpm 12 closed that loophole and broke the build.
allowBuilds:
  esbuild: true
# Older pnpm spelling of the same approval.
onlyBuiltDependencies:
  - esbuild
# Don't re-run `pnpm install` before every `pnpm <script>` invocation.
verifyDepsBeforeRun: false
# Force patched transitive dependencies that the packages pulling them in
# haven't bumped yet. All three stay inside the same major, so they're
# drop-in; drop an entry once the parent ships the fix itself.
overrides:
  # GHSA: <0.7.0 accepts out-of-bounds characters in name/path/domain.
  # SvelteKit still pins ^0.6.0.
  cookie: "^0.7.0"
  # <5.9.3: quadratic blow-up on repeated strings, shared-memory serialisation,
  # typed-array reviver bypass. Pulled in by @sveltejs/kit.
  devalue: "^5.9.3"
  # <1.2.2: event-loop DoS. Pulled in by vite/postcss.
  source-map-js: "^1.2.2"
